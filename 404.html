<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page introuvable | Yassine EL JARJINI</title>
  <style>
    :root { --bg: #0f1115; --text: #f5f5f5; --muted: #a0a4ad; --accent: #7aa2ff; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #ffffff; --text: #111111; --muted: #555b66; --accent: #2456d6; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { padding: 16px; text-align: center; max-width: 480px; }
    h1 { font-size: 4rem; margin: 0; color: var(--accent); }
    h2 { font-size: 1.4rem; margin: 8px 0 12px; }
    p { color: var(--muted); line-height: 1.6; }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>Page introuvable</h2>
    <p>Cette page n'existe pas ou a été déplacée.</p>
    <p><a href="/">Retour à l'accueil</a></p>
  </main>
</body>
</html>
